services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: direhire
      POSTGRES_USER: direhire
      POSTGRES_PASSWORD: direhire
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U direhire"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - direhire-postgres:/var/lib/postgresql/data

volumes:
  direhire-postgres:

